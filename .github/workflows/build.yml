---
name: Build

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs per ref while iterating, but let every main commit
# finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build
    # countdown builds on Etienne's self-hosted runner; nutricalc uses a
    # GitHub-hosted runner with Nix installed on the fly.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: POC Python (nix build lance pytest via doCheck)
        run: nix build .#default --print-build-logs

      # Construit le site tel qu'il est déployé (pnpm test + build via Nix).
      # Échoue si `pnpmDeps.hash` n'a pas été regénéré après un changement de
      # dépendances, en affichant le hash attendu.
      - name: Web — nix build (artefact déployé)
        run: nix build .#web --print-build-logs

      # Vérifie en plus le parcours de dev quotidien (pnpm dans le devShell),
      # que le build Nix ci-dessus ne couvre pas.
      - name: Web — install, test, build
        run: |
          nix develop --command bash -c '
            set -e
            pnpm install --frozen-lockfile
            pnpm test
            pnpm build
          '
